<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050c1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prasanjeet Debnath</title>
<link rel="preload" as="image" href="assets/prasanjeet-product-style-3.png">
<link rel="stylesheet" href="card.css">
</head>
<body>
  <div class="amb"></div>

  <div class="stage">
    <div class="float">
      <div class="frame">
        <img class="card" src="assets/prasanjeet-product-style-3.png" alt="Prasanjeet Debnath business card">
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="actions">
    <a id="save" href="assets/prasanjeet-product-style-3.png">&#11015; Save Card</a>
    <button id="share" type="button" hidden>&#8679; Share</button>
    <button id="play" type="button">&#9654; Play</button>
  </div>

  <div id="splash">
    <video id="vid" src="assets/splash.mp4" playsinline preload="metadata"></video>
    <button id="close" aria-label="Close">&#10005;</button>
  </div>

<script src="../logging/client/telemetry.js"></script>
<script>
  // Before card.js, so window.slog exists by the time it logs card:ready.
  // Failing to load must not stop the card, hence the guard rather than a
  // hard dependency.
  if (window.slog) slog.init({
    endpoint: 'https://site-logs.office-product-style.workers.dev',
    site: 'prasanjeet.com',
    stream: 'user',
  });
</script>
<script src="card.js"></script>
</body>
</html>
